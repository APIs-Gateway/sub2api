# 每个 commit 的一轮 CI(PR 只跑 pull_request 那轮,main 只跑 push 那轮)共上传 4 次:
#   backend 3 次(unit-cover / integration-cover / integration-race-a 三个分片各一次,
#   见 .github/workflows/backend-ci.yml 的 backend job)+ frontend 1 次(frontend-coverage)。
# 等这 4 次都到齐再算 status / 发评论,避免 frontend 先到、backend 没传完就算出偏低的假 fail。
# 改上传次数(增减带 coverage_file 的分片、增减 frontend 上传)时必须同步改下面两处 after_n_builds。
# main requires the legacy codecov/patch commit status.
github_checks: false

codecov:
  notify:
    wait_for_ci: true
    after_n_builds: 4

coverage:
  status:
    # 整个项目的总覆盖率:只报告、不挡合并(避免历史低覆盖拖死 PR)
    project:
      default:
        informational: true
    # 本次 PR 改动的那些行:必须 ≥85% 才绿(逼新代码补测试)
    patch:
      default:
        target: 85%
        threshold: 0%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  after_n_builds: 4

# 前后端分别打 flag,各自统计;某次只传到一边时沿用上次另一边的数据
flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true

# 生成代码 / 迁移 / 产物 / 测试文件本身不计入覆盖率
ignore:
  - "backend/ent/**"
  - "backend/cmd/server/wire_gen.go"
  - "backend/migrations/**"
  - "backend/bin/**"
  - "backend/**/*_test.go"
  - "frontend/dist/**"
  - "frontend/src/main.ts"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "**/*.d.ts"
