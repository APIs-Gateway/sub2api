name: Temporary private H3 contract formatting

on:
  push:
    branches:
      - codex/req-h3-parser-contract-1712

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_HEAD: 867aba4590c198cfe012e60847e2fa11ffa2b7fe
      PARENT_HEAD: 867aba4590c198cfe012e60847e2fa11ffa2b7fe
      CI_SOURCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: false
      - name: Verify exact workflow head and frozen source base
        shell: bash
        run: |
          set -euo pipefail
          printf 'FORMAT_ROOT=%s\n' "$RUNNER_TEMP/req-h3-contract-format-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$PARENT_HEAD"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          test "$(git diff --name-only "$BASE_HEAD" HEAD)" = '.github/workflows/codex-req-h3-contract-format.yml'
          go version | tee "$RUNNER_TEMP/req-h3-contract-go-version-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          grep -Eq '^go version go1\.26\.9 linux/amd64$' "$RUNNER_TEMP/req-h3-contract-go-version-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
      - name: Initialize fresh temporary fixture directories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYINIT'
          import os
          from pathlib import Path
          root = Path(os.environ['FORMAT_ROOT'])
          assert root.parent == Path(os.environ['RUNNER_TEMP'])
          assert not root.exists()
          (root / 'input').mkdir(parents=True)
          (root / 'output').mkdir()
          (root / 'metadata').mkdir()
          (root / 'source-head.txt').write_text(os.environ['CI_SOURCE_HEAD'] + '\n')
          (root / 'source-base.txt').write_text(os.environ['BASE_HEAD'] + '\n')
          PYINIT
      - name: Decode sealed frame_contract_test.go fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDATA'
          import base64, hashlib, json, os
          from pathlib import Path
          item = {"name":"frame_contract_test.go","sourcePath":"backend/third_party/req/internal/http3/frame_contract_test.go","bytes":14439,"sha256":"2c1cae3031d214452a7ccf4045dc43809b6058266e30ec14d146b21a5e5323fe","base64":""}
          root = Path(os.environ['FORMAT_ROOT'])
          assert item['name'] == 'frame_contract_test.go'
          assert Path(item['sourcePath']).name == item['name']
          assert root.parent == Path(os.environ['RUNNER_TEMP'])
          data = base64.b64decode(item['base64'], validate=True)
          assert len(data) == item['bytes']
          assert hashlib.sha256(data).hexdigest() == item['sha256']
          assert not (root / 'input' / item['name']).exists()
          assert not (root / 'output' / item['name']).exists()
          (root / 'input' / item['name']).write_bytes(data)
          (root / 'output' / item['name']).write_bytes(data)
          (root / 'metadata' / (item['name'] + '.json')).write_text(json.dumps({k: v for k, v in item.items() if k != 'base64'}, indent=2) + '\n')
          PYDATA
      - name: Decode sealed header_contract_test.go fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDATA'
          import base64, hashlib, json, os
          from pathlib import Path
          item = {"name":"header_contract_test.go","sourcePath":"backend/third_party/req/internal/http3/header_contract_test.go","bytes":8113,"sha256":"340d6c8f7ba31cfe68803785b2803dc49934df45f4ead52906ee90e216a7dbef","base64":""}
          root = Path(os.environ['FORMAT_ROOT'])
          assert item['name'] == 'header_contract_test.go'
          assert Path(item['sourcePath']).name == item['name']
          assert root.parent == Path(os.environ['RUNNER_TEMP'])
          data = base64.b64decode(item['base64'], validate=True)
          assert len(data) == item['bytes']
          assert hashlib.sha256(data).hexdigest() == item['sha256']
          assert not (root / 'input' / item['name']).exists()
          assert not (root / 'output' / item['name']).exists()
          (root / 'input' / item['name']).write_bytes(data)
          (root / 'output' / item['name']).write_bytes(data)
          (root / 'metadata' / (item['name'] + '.json')).write_text(json.dumps({k: v for k, v in item.items() if k != 'base64'}, indent=2) + '\n')
          PYDATA
      - name: Decode sealed request_writer_contract_test.go fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDATA'
          import base64, hashlib, json, os
          from pathlib import Path
          item = {"name":"request_writer_contract_test.go","sourcePath":"backend/third_party/req/internal/http3/request_writer_contract_test.go","bytes":6108,"sha256":"400c881d9217ab8c68f7fc222214e295310305a5480d1ec52e21c169c5e1fffc","base64":""}
          root = Path(os.environ['FORMAT_ROOT'])
          assert item['name'] == 'request_writer_contract_test.go'
          assert Path(item['sourcePath']).name == item['name']
          assert root.parent == Path(os.environ['RUNNER_TEMP'])
          data = base64.b64decode(item['base64'], validate=True)
          assert len(data) == item['bytes']
          assert hashlib.sha256(data).hexdigest() == item['sha256']
          assert not (root / 'input' / item['name']).exists()
          assert not (root / 'output' / item['name']).exists()
          (root / 'input' / item['name']).write_bytes(data)
          (root / 'output' / item['name']).write_bytes(data)
          (root / 'metadata' / (item['name'] + '.json')).write_text(json.dumps({k: v for k, v in item.items() if k != 'base64'}, indent=2) + '\n')
          PYDATA
      - name: Verify all three decoded sealed inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSET'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['FORMAT_ROOT'])
          names = {'frame_contract_test.go', 'header_contract_test.go', 'request_writer_contract_test.go'}
          assert {v.name for v in (root / 'input').iterdir()} == names
          assert {v.name for v in (root / 'output').iterdir()} == names
          assert {v.name for v in (root / 'metadata').iterdir()} == {n + '.json' for n in names}
          inputs = [json.loads((root / 'metadata' / (name + '.json')).read_text()) for name in sorted(names)]
          for item in inputs:
              data = (root / 'input' / item['name']).read_bytes()
              assert len(data) == item['bytes'] and hashlib.sha256(data).hexdigest() == item['sha256']
              assert (root / 'output' / item['name']).read_bytes() == data
          (root / 'input-manifest.json').write_text(json.dumps(inputs, indent=2) + '\n')
          PYSET
      - name: Format copies and preserve complete differences
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/req-h3-contract-go-version-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt" "$FORMAT_ROOT/go-version.txt"
          # Go 1.26.9 uses exit1 for an actual formatting diff, exit2 for errors.
          set +e
          gofmt -d "$FORMAT_ROOT/input/frame_contract_test.go" "$FORMAT_ROOT/input/header_contract_test.go" "$FORMAT_ROOT/input/request_writer_contract_test.go" > "$FORMAT_ROOT/gofmt.diff" 2> "$FORMAT_ROOT/gofmt-d.stderr"
          diff_status=$?
          set -e
          printf '%s\n' "$diff_status" > "$FORMAT_ROOT/gofmt-d.exit"
          case "$diff_status" in
            0) test ! -s "$FORMAT_ROOT/gofmt.diff" ;;
            1) test -s "$FORMAT_ROOT/gofmt.diff" ;;
            *) exit "$diff_status" ;;
          esac
          test ! -s "$FORMAT_ROOT/gofmt-d.stderr"
          gofmt -w "$FORMAT_ROOT/output/frame_contract_test.go" "$FORMAT_ROOT/output/header_contract_test.go" "$FORMAT_ROOT/output/request_writer_contract_test.go"
          gofmt -l "$FORMAT_ROOT/output/frame_contract_test.go" "$FORMAT_ROOT/output/header_contract_test.go" "$FORMAT_ROOT/output/request_writer_contract_test.go" > "$FORMAT_ROOT/formatted-gofmt-list.txt"
          test ! -s "$FORMAT_ROOT/formatted-gofmt-list.txt"
          python3 - <<'PYPROOF'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['FORMAT_ROOT'])
          inputs = json.loads((root / 'input-manifest.json').read_text())
          proof = []
          for item in inputs:
              original = (root / 'input' / item['name']).read_bytes()
              formatted = (root / 'output' / item['name']).read_bytes()
              assert len(original) == item['bytes'] and hashlib.sha256(original).hexdigest() == item['sha256']
              assert formatted
              proof.append({'sourcePath': item['sourcePath'], 'name': item['name'], 'inputBytes': len(original), 'inputSHA256': hashlib.sha256(original).hexdigest(), 'outputBytes': len(formatted), 'outputSHA256': hashlib.sha256(formatted).hexdigest()})
          (root / 'format-proof.json').write_text(json.dumps({'sourceHead': os.environ['CI_SOURCE_HEAD'], 'baseHead': os.environ['BASE_HEAD'], 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'files': proof, 'formattedGofmtListEmpty': True, 'projectTestsExecuted': False}, indent=2) + '\n')
          PYPROOF
          test -z "$(git status --porcelain)"
          printf '%s\n' 'complete' > "$FORMAT_ROOT/complete.txt"
      - name: Preserve exact input, formatted output, SHA proofs and differences
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: req-h3-contract-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/req-h3-contract-format-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
