name: Digest1743 frozen OLD NEW remote formatter
on:
  push:
    branches: [codex/req-client-f-format-c5fb-20261019]
permissions:
  contents: read
jobs:
  format-frozen-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLD_HEAD: 7b0d92fb4c6bd52a62218d505130944163b73464
      OLD_TREE: c34bdcd39f97ea0623ff0aad9cfcbf04b04d7612
      NEW_HEAD: beed0eb87da3eeb8f88ca7706d0e54a6cb6452d2
      NEW_TREE: c15e6475533244ae0736c6ed34700223a3d9b02f
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Initialize fixed external evidence before checkout
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/digest1743-format-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$evidence"
          mkdir -p "$evidence"
          printf 'FORMAT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/controller-event-head.txt"
          printf '%s\n' "$OLD_HEAD" "$OLD_TREE" "$NEW_HEAD" "$NEW_TREE" > "$evidence/expected-source-heads-trees.txt"
          cp "$GITHUB_EVENT_PATH" "$evidence/event.json"
      - name: Checkout controller and full Git history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact full OLD application
        uses: actions/checkout@v6
        with:
          ref: 7b0d92fb4c6bd52a62218d505130944163b73464
          path: old
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact full NEW application
        uses: actions/checkout@v6
        with:
          ref: beed0eb87da3eeb8f88ca7706d0e54a6cb6452d2
          path: new
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze complete repositories and original copy inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -B controller/.github/ci/digest1743-format.py prepare "$GITHUB_WORKSPACE/controller" "$GITHUB_WORKSPACE/old" "$GITHUB_WORKSPACE/new" "$FORMAT_EVIDENCE"
      - name: Install pinned formatter without repository cache
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: false
      - name: Preserve actual raw diff write post-diff and list results
        shell: bash
        run: |
          set -euo pipefail
          go version > "$FORMAT_EVIDENCE/go-version.txt"
          grep -Eq '^go version go1\.26\.9 linux/amd64$' "$FORMAT_EVIDENCE/go-version.txt"
          formatter="$(go env GOROOT)/bin/gofmt"
          printf '%s\n' "$formatter" > "$FORMAT_EVIDENCE/formatter-path.txt"
          sha256sum "$formatter" > "$FORMAT_EVIDENCE/formatter.sha256"
          capture() {
            local label="$1"
            shift
            set +e
            "$@" > "$label.stdout" 2> "$label.stderr"
            local actual_status=$?
            set -e
            printf '%s\n' "$actual_status" > "$label.exit"
          }
          for phase in old new; do
            for name in digest_ownership_peer_test.go digest_ownership_contract_test.go digest.go; do
              relative="backend/third_party/req/$name"
              result="$FORMAT_EVIDENCE/results/$phase/$name"
              mkdir -p "$result"
              capture "$result/raw-diff" "$formatter" -d "$FORMAT_EVIDENCE/raw/$phase/$relative"
              capture "$result/write-copy" "$formatter" -w "$FORMAT_EVIDENCE/formatted/$phase/$relative"
              capture "$result/formatted-diff" "$formatter" -d "$FORMAT_EVIDENCE/formatted/$phase/$relative"
              capture "$result/formatted-list" "$formatter" -l "$FORMAT_EVIDENCE/formatted/$phase/$relative"
            done
            capture "$FORMAT_EVIDENCE/results/$phase/reviewed-F5-list" "$formatter" -l "$FORMAT_EVIDENCE/raw/$phase/backend/third_party/req/client_behavior_peer_test.go" "$FORMAT_EVIDENCE/raw/$phase/backend/third_party/req/client_behavior_observer_test.go" "$FORMAT_EVIDENCE/raw/$phase/backend/third_party/req/client_behavior_contract_test.go" "$FORMAT_EVIDENCE/raw/$phase/backend/third_party/req/client_redirect_cookie_contract_test.go" "$FORMAT_EVIDENCE/raw/$phase/backend/third_party/req/client_response_contract_test.go"
          done
      - name: Freeze full Git inputs again after formatter or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          capture_snapshot() {
            local label="$1" head="$2" tree="$3"
            set +e
            python3 -B "$GITHUB_WORKSPACE/controller/.github/ci/digest1743-format.py" snapshot "$GITHUB_WORKSPACE/$label" "$head" "$tree" "$FORMAT_EVIDENCE/$label-after.json" > "$FORMAT_EVIDENCE/$label-after.stdout" 2> "$FORMAT_EVIDENCE/$label-after.stderr"
            local actual_status=$?
            set -e
            printf '%s\n' "$actual_status" > "$FORMAT_EVIDENCE/$label-after.exit"
          }
          capture_snapshot old "$OLD_HEAD" "$OLD_TREE"
          capture_snapshot new "$NEW_HEAD" "$NEW_TREE"
          capture_snapshot controller "$GITHUB_SHA" ''
      - name: Judge actual outcomes and identical fixture formatter output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -B controller/.github/ci/digest1743-format.py judge "$FORMAT_EVIDENCE" > "$FORMAT_EVIDENCE/judge.stdout" 2> "$FORMAT_EVIDENCE/judge.stderr"
          actual_status=$?
          set -e
          printf '%s\n' "$actual_status" > "$FORMAT_EVIDENCE/judge.exit"
          test "$actual_status" -eq 0
      - name: Always retain full archives raw bytes output and real failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest1743-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digest1743-format-${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
