name: Frozen F public client formatter only

on:
  push:
    branches:
      - codex/req-client-f-format-c5fb-20261019

permissions:
  contents: read

jobs:
  formatter:
    name: Format only sealed five F Go inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      SOURCE_HEAD: 'c5fb66a3f58e3af00832fe9523e3697fdad0df97'
      SOURCE_TREE: '8671aef66f9a56a4f36b6227427a802a33a63a11'
      SEALED_PAYLOAD_SHA256: '66dd0f7479ef686b19284ded5919d851cbb776c246a1d495abe777ae62586623'
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: false
      - name: Verify sealed source and capture only remote formatter results
        shell: bash
        env:
          SEALED_SOURCE_PAYLOAD: ''
        run: |
          set -euo pipefail
          export FORMAT_EVIDENCE="$RUNNER_TEMP/req-client-f-formatter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$FORMAT_EVIDENCE"
          mkdir -p "$FORMAT_EVIDENCE"
          printf '%s\n' "FORMAT_EVIDENCE=$FORMAT_EVIDENCE" >> "$GITHUB_ENV"
          python3 -B - <<'PYFORMAT'
          import base64, hashlib, json, os, shutil, subprocess
          from pathlib import Path, PurePosixPath
          evidence = Path(os.environ['FORMAT_EVIDENCE'])
          def save(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          def capture(command, prefix):
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              save(evidence / (prefix + '.stdout'), result.stdout)
              save(evidence / (prefix + '.stderr'), result.stderr)
              save(evidence / (prefix + '.exit'), (str(result.returncode) + '\n').encode())
              return result
          try:
              payload = base64.b64decode(os.environ['SEALED_SOURCE_PAYLOAD'], validate=True)
              assert digest(payload) == os.environ['SEALED_PAYLOAD_SHA256'], 'payload hash differs'
              document = json.loads(payload)
              assert document['sourceHead'] == os.environ['SOURCE_HEAD']
              assert document['sourceTree'] == os.environ['SOURCE_TREE']
              expected = {'backend/third_party/req/' + name for name in (
                  'client_behavior_peer_test.go', 'client_behavior_observer_test.go',
                  'client_behavior_contract_test.go', 'client_redirect_cookie_contract_test.go',
                  'client_response_contract_test.go')}
              assert len(document['files']) == 5 and {item['path'] for item in document['files']} == expected
              seal = []
              for item in document['files']:
                  path = PurePosixPath(item['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  data = base64.b64decode(item['base64'], validate=True)
                  assert len(data) == item['bytes'] and digest(data) == item['sha256']
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == item['gitBlob']
                  save(evidence / 'original' / path, data)
                  save(evidence / 'formatted' / path, data)
                  seal.append({key: value for key, value in item.items() if key != 'base64'})
              source_seal = {'sourceHead': document['sourceHead'], 'sourceTree': document['sourceTree'],
                             'payloadSHA256': os.environ['SEALED_PAYLOAD_SHA256'], 'files': seal,
                             'workflowHead': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                             'runAttempt': os.environ['GITHUB_RUN_ATTEMPT']}
              save(evidence / 'source-seal.json', (json.dumps(source_seal, indent=2) + '\n').encode())
              version = capture(['go', 'version'], 'go-version')
              assert version.returncode == 0 and version.stdout.strip() == b'go version go1.26.9 linux/amd64' and not version.stderr
              results = []
              problems = []
              for item in seal:
                  original = evidence / 'original' / item['path']
                  formatted = evidence / 'formatted' / item['path']
                  name = Path(item['path']).name
                  before_diff = capture(['gofmt', '-d', str(original)], name + '.before-diff')
                  before_list = capture(['gofmt', '-l', str(original)], name + '.before-list')
                  written = capture(['gofmt', '-w', str(formatted)], name + '.write')
                  after_diff = capture(['gofmt', '-d', str(formatted)], name + '.after-diff')
                  after_list = capture(['gofmt', '-l', str(formatted)], name + '.after-list')
                  commands = [before_diff, before_list, written, after_diff, after_list]
                  if any(result.returncode != 0 or result.stderr for result in commands):
                      problems.append('formatter process error: ' + item['path'])
                  if written.stdout or after_diff.stdout or after_list.stdout:
                      problems.append('formatted output is not clean: ' + item['path'])
                  assert digest(original.read_bytes()) == item['sha256'], 'original input mutated'
                  formatted_data = formatted.read_bytes()
                  assert formatted_data, 'empty formatted output'
                  results.append({'path': item['path'], 'originalSHA256': item['sha256'],
                                  'formattedSHA256': digest(formatted_data), 'formattedBytes': len(formatted_data),
                                  'originalNeedsFormatting': bool(before_diff.stdout or before_list.stdout),
                                  'actualExits': [result.returncode for result in commands]})
              report = {'sourceHead': document['sourceHead'], 'sourceTree': document['sourceTree'],
                        'files': results, 'problems': problems, 'passed': not problems,
                        'scope': 'Remote gofmt only on five sealed raw F Go files. No tests, builds, production changes or runtime behavior validation.'}
              save(evidence / 'actual-format-report.json', (json.dumps(report, indent=2) + '\n').encode())
              assert not problems, problems
              save(evidence / 'complete.txt', b'complete\n')
          except Exception as error:
              save(evidence / 'controller-failure.json', (json.dumps({'type': type(error).__name__, 'error': str(error)}, indent=2) + '\n').encode())
              raise
          PYFORMAT
      - name: Preserve original inputs, formatted outputs and every actual formatter stream and exit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: req-client-f-formatter-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/req-client-f-formatter-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
