name: Passthrough toggle SAME fixture four-flavor proof
on:
  push:
    branches:
      - codex/passthrough-1681-proof
permissions:
  contents: read
jobs:
  proof:
    name: ${{ matrix.target }}-actual-toggle-component
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: NEW
            ref: ba5cbf3e9d5f9ead40914d169a7246bdcf12705d
            overlay: none
          - target: PRE_REVIEW
            ref: 630c2db07c3a134e1977cea4de7bcf311d9b9c09
            overlay: none
          - target: OLD
            ref: 14d48cfd2ee9bac4b094b9d79addc17ac5317fd5
            overlay: none
          - target: UPSTREAM_ONLY
            ref: 14d48cfd2ee9bac4b094b9d79addc17ac5317fd5
            overlay: upstream
          - target: PARTIAL_SERIALIZATION
            ref: 14d48cfd2ee9bac4b094b9d79addc17ac5317fd5
            overlay: partial
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Freeze identical fixture and exact adapted intermediate components
        run: |
          mkdir -p "$RUNNER_TEMP/toggle-same"
          cp frontend/src/components/admin/__tests__/ErrorPassthroughRulesModal.toggle.spec.ts "$RUNNER_TEMP/toggle-same/toggle.ts"
          git show 84f09aa0f368d0270fc88c86a5b3080b7fb3367b:frontend/src/components/admin/ErrorPassthroughRulesModal.vue > "$RUNNER_TEMP/toggle-same/upstream.vue"
          git show cc1e24c0ac852d2498dcbde40acffb128de1571f:frontend/src/components/admin/ErrorPassthroughRulesModal.vue > "$RUNNER_TEMP/toggle-same/partial.vue"
          git hash-object frontend/src/components/admin/__tests__/ErrorPassthroughRulesModal.toggle.spec.ts "$RUNNER_TEMP/toggle-same/upstream.vue" "$RUNNER_TEMP/toggle-same/partial.vue"
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Verify exact checkout, fixture and intended production component
        env:
          PROOF_OVERLAY: ${{ matrix.overlay }}
        run: |
          git rev-parse HEAD
          cp "$RUNNER_TEMP/toggle-same/toggle.ts" frontend/src/components/admin/__tests__/ErrorPassthroughRulesModal.toggle.spec.ts
          if [ "$PROOF_OVERLAY" != none ]; then
            cp "$RUNNER_TEMP/toggle-same/$PROOF_OVERLAY.vue" frontend/src/components/admin/ErrorPassthroughRulesModal.vue
          fi
          git hash-object frontend/src/components/admin/__tests__/ErrorPassthroughRulesModal.toggle.spec.ts frontend/src/components/admin/ErrorPassthroughRulesModal.vue
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install exact frozen frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Actual per-rule toggle serialization, late response, reopened-row and failure controls
        working-directory: frontend
        run: pnpm exec vitest run --reporter=verbose src/components/admin/__tests__/ErrorPassthroughRulesModal.toggle.spec.ts
