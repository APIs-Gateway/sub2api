name: Astra Ultrafast SAME fixture OLD NEW proof
on:
  push:
    branches:
      - codex/astra-ultrafast-1671-proof
permissions:
  contents: read
jobs:
  proof:
    name: ${{ matrix.target }}-${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: NEW
            suite: unit
            ref: cc3ae5631fb29a61156cfe858faa684b0274d785
          - target: NEW
            suite: postgres
            ref: cc3ae5631fb29a61156cfe858faa684b0274d785
          - target: OLD
            suite: unit
            ref: 14d48cfd2ee9bac4b094b9d79addc17ac5317fd5
          - target: OLD
            suite: postgres
            ref: 14d48cfd2ee9bac4b094b9d79addc17ac5317fd5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Freeze identical public contract fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/astra-same"
          cp backend/internal/service/openai_ultrafast_contract_test.go "$RUNNER_TEMP/astra-same/0.go"
          cp backend/internal/service/openai_ultrafast_manifest_test.go "$RUNNER_TEMP/astra-same/1.go"
          cp backend/internal/repository/openai_ultrafast_integration_test.go "$RUNNER_TEMP/astra-same/2.go"
          git hash-object backend/internal/service/openai_ultrafast_contract_test.go backend/internal/service/openai_ultrafast_manifest_test.go backend/internal/repository/openai_ultrafast_integration_test.go
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Verify exact checkout and identical fixtures
        run: |
          git rev-parse HEAD
          cp "$RUNNER_TEMP/astra-same/0.go" backend/internal/service/openai_ultrafast_contract_test.go
          cp "$RUNNER_TEMP/astra-same/1.go" backend/internal/service/openai_ultrafast_manifest_test.go
          cp "$RUNNER_TEMP/astra-same/2.go" backend/internal/repository/openai_ultrafast_integration_test.go
          git hash-object backend/internal/service/openai_ultrafast_contract_test.go backend/internal/service/openai_ultrafast_manifest_test.go backend/internal/repository/openai_ultrafast_integration_test.go
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Actual public forwarding, quote, policy and manifest contracts
        if: matrix.suite == 'unit'
        working-directory: backend
        env:
          CGO_ENABLED: "1"
        run: go test -tags=unit -race -count=1 -v -run '^TestAstraUltrafast_' ./internal/service/
      - name: Actual PostgreSQL Redis HTTP WS wallet and card contracts
        if: matrix.suite == 'postgres'
        working-directory: backend
        env:
          CGO_ENABLED: "1"
        run: go test -tags=integration -race -count=1 -v -run '^TestAstraUltrafastHTTP_' ./internal/repository/
