name: Temporary req lifecycle fixture formatting

on:
  push:
    branches:
      - codex/req-http1-lifecycle-1712

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_HEAD: bd19182073ff9ec6accfc2f30c02e3684a0ceef7
      PARENT_HEAD: 7ea17e1d3f359aa1dbcd77f2c8a5905648764a3c
      CI_SOURCE_HEAD: ${{ github.sha }}
      FORMAT_ROOT: ${{ runner.temp }}/req-lifecycle-format-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: false
      - name: Verify exact workflow head and frozen source base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$PARENT_HEAD"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          test "$(git diff --name-only "$BASE_HEAD" HEAD)" = '.github/workflows/codex-req-lifecycle-format.yml'
          go version | tee "$RUNNER_TEMP/req-lifecycle-go-version-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          grep -Eq '^go version go1\.26\.9 linux/amd64$' "$RUNNER_TEMP/req-lifecycle-go-version-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
      - name: Initialize fresh temporary fixture directories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYINIT'
          import os
          from pathlib import Path
          root = Path(os.environ['FORMAT_ROOT'])
          assert root.parent == Path(os.environ['RUNNER_TEMP'])
          assert not root.exists()
          (root / 'input').mkdir(parents=True)
          (root / 'output').mkdir()
          (root / 'metadata').mkdir()
          (root / 'source-head.txt').write_text(os.environ['CI_SOURCE_HEAD'] + '\n')
          (root / 'source-base.txt').write_text(os.environ['BASE_HEAD'] + '\n')
          PYINIT
      - name: Decode sealed http1_lifecycle_test.go fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDATA'
          import base64, hashlib, json, os
          from pathlib import Path
          item = {"name":"http1_lifecycle_test.go","sourcePath":"backend/third_party/req/http1_lifecycle_test.go","bytes":11811,"sha256":"269ff6b580dfbfa0e7d4e73f3f9c09e1f10f954e5de297fbeccb0a8ce407e16a","base64":""}
          root = Path(os.environ['FORMAT_ROOT'])
          assert item['name'] == 'http1_lifecycle_test.go'
          assert Path(item['sourcePath']).name == item['name']
          assert root.parent == Path(os.environ['RUNNER_TEMP'])
          data = base64.b64decode(item['base64'], validate=True)
          assert len(data) == item['bytes']
          assert hashlib.sha256(data).hexdigest() == item['sha256']
          assert not (root / 'input' / item['name']).exists()
          assert not (root / 'output' / item['name']).exists()
          (root / 'input' / item['name']).write_bytes(data)
          (root / 'output' / item['name']).write_bytes(data)
          (root / 'metadata' / (item['name'] + '.json')).write_text(json.dumps({k: v for k, v in item.items() if k != 'base64'}, indent=2) + '\n')
          PYDATA
      - name: Decode sealed http1_upload_test.go fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDATA'
          import base64, hashlib, json, os
          from pathlib import Path
          item = {"name":"http1_upload_test.go","sourcePath":"backend/third_party/req/http1_upload_test.go","bytes":3563,"sha256":"9e28cf9941253a39ddb647759f562b05dcbde81a9c6af56f0d5c9c7a8cf54d22","base64":""}
          root = Path(os.environ['FORMAT_ROOT'])
          assert item['name'] == 'http1_upload_test.go'
          assert Path(item['sourcePath']).name == item['name']
          assert root.parent == Path(os.environ['RUNNER_TEMP'])
          data = base64.b64decode(item['base64'], validate=True)
          assert len(data) == item['bytes']
          assert hashlib.sha256(data).hexdigest() == item['sha256']
          assert not (root / 'input' / item['name']).exists()
          assert not (root / 'output' / item['name']).exists()
          (root / 'input' / item['name']).write_bytes(data)
          (root / 'output' / item['name']).write_bytes(data)
          (root / 'metadata' / (item['name'] + '.json')).write_text(json.dumps({k: v for k, v in item.items() if k != 'base64'}, indent=2) + '\n')
          PYDATA
      - name: Decode sealed proxy_lifecycle_test.go fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDATA'
          import base64, hashlib, json, os
          from pathlib import Path
          item = {"name":"proxy_lifecycle_test.go","sourcePath":"backend/third_party/req/proxy_lifecycle_test.go","bytes":11586,"sha256":"a6a57d1888ed27080f9b1c0ec93e7107029fc30f87cd45ad51f4ef713ebf40cc","base64":""}
          root = Path(os.environ['FORMAT_ROOT'])
          assert item['name'] == 'proxy_lifecycle_test.go'
          assert Path(item['sourcePath']).name == item['name']
          assert root.parent == Path(os.environ['RUNNER_TEMP'])
          data = base64.b64decode(item['base64'], validate=True)
          assert len(data) == item['bytes']
          assert hashlib.sha256(data).hexdigest() == item['sha256']
          assert not (root / 'input' / item['name']).exists()
          assert not (root / 'output' / item['name']).exists()
          (root / 'input' / item['name']).write_bytes(data)
          (root / 'output' / item['name']).write_bytes(data)
          (root / 'metadata' / (item['name'] + '.json')).write_text(json.dumps({k: v for k, v in item.items() if k != 'base64'}, indent=2) + '\n')
          PYDATA
      - name: Verify all three decoded sealed inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSET'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['FORMAT_ROOT'])
          names = {'http1_lifecycle_test.go', 'http1_upload_test.go', 'proxy_lifecycle_test.go'}
          assert {v.name for v in (root / 'input').iterdir()} == names
          assert {v.name for v in (root / 'output').iterdir()} == names
          assert {v.name for v in (root / 'metadata').iterdir()} == {n + '.json' for n in names}
          inputs = [json.loads((root / 'metadata' / (name + '.json')).read_text()) for name in sorted(names)]
          for item in inputs:
              data = (root / 'input' / item['name']).read_bytes()
              assert len(data) == item['bytes'] and hashlib.sha256(data).hexdigest() == item['sha256']
              assert (root / 'output' / item['name']).read_bytes() == data
          (root / 'input-manifest.json').write_text(json.dumps(inputs, indent=2) + '\n')
          PYSET
      - name: Format copies and preserve complete differences
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/req-lifecycle-go-version-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt" "$FORMAT_ROOT/go-version.txt"
          gofmt -d "$FORMAT_ROOT/input/http1_lifecycle_test.go" "$FORMAT_ROOT/input/http1_upload_test.go" "$FORMAT_ROOT/input/proxy_lifecycle_test.go" > "$FORMAT_ROOT/gofmt.diff"
          gofmt -w "$FORMAT_ROOT/output/http1_lifecycle_test.go" "$FORMAT_ROOT/output/http1_upload_test.go" "$FORMAT_ROOT/output/proxy_lifecycle_test.go"
          gofmt -l "$FORMAT_ROOT/output/http1_lifecycle_test.go" "$FORMAT_ROOT/output/http1_upload_test.go" "$FORMAT_ROOT/output/proxy_lifecycle_test.go" > "$FORMAT_ROOT/formatted-gofmt-list.txt"
          test ! -s "$FORMAT_ROOT/formatted-gofmt-list.txt"
          python3 - <<'PYPROOF'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['FORMAT_ROOT'])
          inputs = json.loads((root / 'input-manifest.json').read_text())
          proof = []
          for item in inputs:
              original = (root / 'input' / item['name']).read_bytes()
              formatted = (root / 'output' / item['name']).read_bytes()
              assert len(original) == item['bytes'] and hashlib.sha256(original).hexdigest() == item['sha256']
              assert formatted
              proof.append({'sourcePath': item['sourcePath'], 'name': item['name'], 'inputBytes': len(original), 'inputSHA256': hashlib.sha256(original).hexdigest(), 'outputBytes': len(formatted), 'outputSHA256': hashlib.sha256(formatted).hexdigest()})
          (root / 'format-proof.json').write_text(json.dumps({'sourceHead': os.environ['CI_SOURCE_HEAD'], 'baseHead': os.environ['BASE_HEAD'], 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'files': proof, 'formattedGofmtListEmpty': True, 'projectTestsExecuted': False}, indent=2) + '\n')
          PYPROOF
          test -z "$(git status --porcelain)"
          printf '%s\n' 'complete' > "$FORMAT_ROOT/complete.txt"
      - name: Preserve exact input, formatted output, SHA proofs and differences
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: req-lifecycle-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FORMAT_ROOT }}/
          if-no-files-found: error
          retention-days: 14
