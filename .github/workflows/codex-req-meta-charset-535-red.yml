name: Temporary req meta charset genuine RED witness

on:
  push:
    branches:
      - codex/req-meta-charset-535-red

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_HEAD: 1ad6f911e5c266bea5fd8224cb21914504a0c06b
      CI_SOURCE_HEAD: ${{ github.sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: false
      - name: Verify source contains the unchanged production decoder and original338 gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_HEAD"
          test "$(git rev-list --parents -n 1 HEAD)" = "$CI_SOURCE_HEAD $BASE_HEAD"
          test "$(git diff --name-only "$BASE_HEAD" HEAD)" = '.github/workflows/codex-req-meta-charset-535-red.yml'
          test "$(git rev-parse HEAD:backend/third_party/req/decode.go)" = '825cffc66a1ae08cb4858ef0ae0d06cb0fc3120f'
          test -z "$(git status --porcelain)"
          evidence="$RUNNER_TEMP/req-meta-charset-535-red-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$evidence"
          mkdir "$evidence"
          printf 'META_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$evidence/head.txt"
          git ls-files --stage > "$evidence/git-index-before.txt"
      - name: Run unchanged full338 baseline race tests source gates original witness and coverage
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          export REQ_SECURITY_EXPECTED_HEAD="$CI_SOURCE_HEAD"
          export REQ_SECURITY_EVIDENCE="$META_EVIDENCE/baseline338"
          bash tools/req-http2-security-ci.sh
      - name: Install only the independently reviewed formatted regression source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDATA'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          item = {"name":"backend/third_party/req/meta_charset_contract_test.go","bytes":6237,"sha256":"7dd43f9d65fc080332b47690822ebe14431cc1eea58980b591454644f2b9fcf5","base64":""}
          target = Path(item['name'])
          assert not target.exists()
          assert item['name'] == 'backend/third_party/req/meta_charset_contract_test.go'
          data = base64.b64decode(item['base64'],validate=True)
          assert len(data) == item['bytes'] and hashlib.sha256(data).hexdigest() == item['sha256']
          target.write_bytes(data)
          root = Path(os.environ['META_EVIDENCE'])
          (root/'test-input.json').write_text(json.dumps({k:v for k,v in item.items() if k != 'base64'},indent=2)+'\n')
          (root/'test-input.go').write_bytes(data)
          assert subprocess.check_output(['git','diff','--name-only','HEAD']).strip() == b''
          assert subprocess.check_output(['git','hash-object','backend/third_party/req/decode.go'],text=True).strip() == '825cffc66a1ae08cb4858ef0ae0d06cb0fc3120f'
          PYDATA
          gofmt -l backend/third_party/req/meta_charset_contract_test.go > "$META_EVIDENCE/gofmt.list"
          test ! -s "$META_EVIDENCE/gofmt.list"
      - name: Execute real public HTTP requests against unchanged decoder
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go test -p=1 -parallel=1 -race -count=1 -timeout=2m -json -run '^TestReqMetaCharset_PublicHTTPBoundary$' github.com/imroc/req/v3 > "$META_EVIDENCE/charset-red.json" 2> "$META_EVIDENCE/charset-red.stderr"
          red_status=$?
          set -e
          printf '%s\n' "$red_status" > "$META_EVIDENCE/charset-red.exit"
          python3 - <<'PYPROOF'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['META_EVIDENCE'])
          assert (root/'charset-red.exit').read_text().strip() == '1'
          events=[json.loads(line) for line in (root/'charset-red.json').read_text().splitlines()]
          package='github.com/imroc/req/v3'
          prefix='TestReqMetaCharset_PublicHTTPBoundary'
          failed={'meta_split_512_gbk','meta_split_128_gb2312'}
          passed={'meta_aligned_512_gbk','header_split_512_gbk','meta_aligned_128_gb2312','disabled_split_512_gbk','no_meta_split_512'}
          expected={prefix+'/'+case for case in failed|passed}
          runs={v['Test'] for v in events if v.get('Package')==package and v.get('Action')=='run' and 'Test' in v}
          assert runs == expected|{prefix}
          proof=[]
          for case in sorted(failed|passed):
              test=prefix+'/'+case
              actual=[v for v in events if v.get('Package')==package and v.get('Test')==test]
              terminal='fail' if case in failed else 'pass'
              assert sum(v.get('Action')=='run' for v in actual)==1
              assert sum(v.get('Action')==terminal for v in actual)==1
              assert not any(v.get('Action') in ({'skip','pass'} if terminal=='fail' else {'skip','fail'}) for v in actual)
              output=''.join(v.get('Output','') for v in actual)
              if terminal=='fail':
                  assert 'META_CHARSET_ASSERT: mode='+case+' real HTTP decoded bytes differ:' in output
              else:
                  assert 'actual HTTP charset: mode='+case+' ' in output
              proof.append({'test':test,'terminal':terminal,'actions':[v['Action'] for v in actual]})
          assert {(v.get('Test')) for v in events if v.get('Action')=='fail' and 'Test' in v} == {prefix}|{prefix+'/'+case for case in failed}
          assert sum(v.get('Action')=='fail' and v.get('Package')==package and 'Test' not in v for v in events)==1
          assert not any(v.get('Action')=='skip' and 'Test' in v for v in events)
          outputs=''.join(v.get('Output','') for v in events)+(root/'charset-red.stderr').read_text()
          assert 'DATA RACE' not in outputs and 'panic:' not in outputs and 'build failed' not in outputs
          assert subprocess.check_output(['git','diff','--name-only','HEAD']).strip() == b''
          blob=subprocess.check_output(['git','hash-object','third_party/req/decode.go'],text=True).strip()
          assert blob=='825cffc66a1ae08cb4858ef0ae0d06cb0fc3120f'
          (root/'genuine-red-proof.json').write_text(json.dumps({'head':os.environ['CI_SOURCE_HEAD'],'base':os.environ['BASE_HEAD'],'unchangedDecoderBlob':blob,'actualFailureCount':2,'actualControlPassCount':5,'baseline338Complete':True,'testProof':proof},indent=2)+'\n')
          PYPROOF
          git diff --exit-code HEAD -- > "$META_EVIDENCE/checkout-after.diff"
          git status --porcelain > "$META_EVIDENCE/status-after.txt"
          printf 'complete\n' > "$META_EVIDENCE/complete.txt"
      - name: Preserve actual baseline and genuine RED evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: req-meta-charset-535-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/req-meta-charset-535-red-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
