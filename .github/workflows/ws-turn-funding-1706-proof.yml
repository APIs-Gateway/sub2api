name: WS1706 frozen actual turn funding OLD NEW proof

on:
  push:
    branches:
      - codex/ws-turn-funding-1706-proof

permissions:
  contents: read

jobs:
  actual-turn-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        side: [OLD, NEW]
    env:
      CGO_ENABLED: "1"
      PROOF_SIDE: ${{ matrix.side }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.side == 'NEW' && '68c1ce4c17abffe10ab3cfe9264e80e70752afe2' || '06b47e4dbff92cb8a1153e71a65deb6fd012dbc6' }}
          fetch-depth: 0
      - name: Pin source, production, dependencies and identical real integration fixtures
