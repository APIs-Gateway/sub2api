name: Owned Responses 1698 current-candidate content-index RED
on:
  push:
    branches: [codex/responses-owned-message-1698-proof]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Freeze candidate and public regression fixture
        run: |
          git merge-base --is-ancestor 4f926681f9eabdd2f96e0a8adb20c56b15a34bb9 HEAD
          git merge-base --is-ancestor faff74124c1008f39c6ee00e126d878028745b13 HEAD
          test "$(git hash-object backend/internal/handler/openai_owned_responses_part_index_test.go)" = f97b19b264c4873768c2b74d307bb9e4d7a33043
          git hash-object backend/internal/handler/openai_owned_responses_part_index_test.go
          cp backend/internal/handler/openai_owned_responses_part_index_test.go /tmp/part-index-fixture.go
          git checkout --detach faff74124c1008f39c6ee00e126d878028745b13
          test "$(git rev-parse HEAD)" = faff74124c1008f39c6ee00e126d878028745b13
          git ls-tree HEAD backend/internal/pkg/apicompat/anthropic_to_responses_response.go backend/internal/pkg/apicompat/chatcompletions_responses_bridge.go backend/internal/pkg/apicompat/responses_stream_event_wire.go backend/internal/pkg/apicompat/responses_to_chatcompletions.go backend/internal/pkg/apicompat/types.go backend/internal/pkg/apicompat/responses_owned_message.go backend/internal/service/openai_gateway_service.go
          cp /tmp/part-index-fixture.go backend/internal/handler/openai_owned_responses_part_index_test.go
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Remote formatting and frozen original fixtures
        run: |
          go version | tee /tmp/part-index-go-version.txt
          go version | grep -q 'go1.26.6'
          gofmt -l backend/internal/handler/openai_owned_responses_part_index_test.go > /tmp/part-index-format.txt
          cat /tmp/part-index-format.txt
          test ! -s /tmp/part-index-format.txt
          test "$(git hash-object backend/internal/handler/openai_owned_responses_message_wire_test.go)" = 84ac29522877dab61e3d821bdfcacfb97db752ac
          git hash-object backend/internal/handler/openai_owned_responses_message_wire_test.go
          test "$(git hash-object backend/internal/pkg/apicompat/responses_owned_message_wire_test.go)" = 1f09a46860aa4d3886a109fc6b259acdfc8f185c
          git hash-object backend/internal/pkg/apicompat/responses_owned_message_wire_test.go
          test "$(git hash-object backend/internal/pkg/apicompat/responses_owned_message_state_test.go)" = e1ba6a2ea9374fb1849047636bcce816994ef5f3
          git hash-object backend/internal/pkg/apicompat/responses_owned_message_state_test.go
      - name: Current candidate actual original86 and content-index14 race tests
        working-directory: backend
        run: |
          set +e
          go test -tags=unit -race -count=1 -timeout=10m -coverpkg=./internal/handler,./internal/service,./internal/pkg/apicompat -covermode=atomic -coverprofile=/tmp/part-index.cover -json -run '^TestOwnedResponses(Message|PartIndex)_' ./internal/handler/ ./internal/pkg/apicompat/ > /tmp/part-index-tests.jsonl 2> /tmp/part-index-tests.stderr
          actual_exit=$?
          set -e
          printf '%s\n' "$actual_exit" > /tmp/part-index-exit.txt
          cat /tmp/part-index-tests.jsonl
          cat /tmp/part-index-tests.stderr
          test -s /tmp/part-index.cover
          head -1 /tmp/part-index.cover | grep -q '^mode: atomic$'
      - name: Require exact eight business failures and every92 control PASS
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = faff74124c1008f39c6ee00e126d878028745b13
          test "$(git hash-object backend/internal/handler/openai_owned_responses_part_index_test.go)" = f97b19b264c4873768c2b74d307bb9e4d7a33043
          git hash-object backend/internal/handler/openai_owned_responses_part_index_test.go
          test "$(git hash-object backend/internal/handler/openai_owned_responses_message_wire_test.go)" = 84ac29522877dab61e3d821bdfcacfb97db752ac
          git hash-object backend/internal/handler/openai_owned_responses_message_wire_test.go
          test "$(git hash-object backend/internal/pkg/apicompat/responses_owned_message_wire_test.go)" = 1f09a46860aa4d3886a109fc6b259acdfc8f185c
          git hash-object backend/internal/pkg/apicompat/responses_owned_message_wire_test.go
          test "$(git hash-object backend/internal/pkg/apicompat/responses_owned_message_state_test.go)" = e1ba6a2ea9374fb1849047636bcce816994ef5f3
          git hash-object backend/internal/pkg/apicompat/responses_owned_message_state_test.go
          python3 - <<'PYCANDIDATE'
          import json, pathlib, re
          events = [json.loads(line) for line in pathlib.Path('/tmp/part-index-tests.jsonl').read_text().splitlines() if line.startswith('{')]
          output = ''.join(e.get('Output','') for e in events) + pathlib.Path('/tmp/part-index-tests.stderr').read_text()
          assert not re.search(r'panic:|WARNING: DATA RACE|\[build failed\]|no tests to run|test timed out', output), 'invalid failure mechanism'
          finished = {(e['Package'],e['Test']):e['Action'] for e in events if 'Test' in e and e['Action'] in ('pass','fail','skip')}
          leaves = {k:v for k,v in finished.items() if not any(q[0] == k[0] and q[1].startswith(k[1]+'/') for q in finished)}
          expected = {'TestOwnedResponsesPartIndex_PublicHTTP/'+mode+'/'+case for mode in ('normal-stream','normal-unary','passthrough-unary') for case in ('empty_output_orders_explicit_parts',)}
          expected |= {'TestOwnedResponsesPartIndex_PublicHTTP/converted_'+route+'_empty_terminal_matches_before_part_insertion' for route in ('chat/completions','messages')}
          expected |= {'TestOwnedResponsesPartIndex_PublicHTTP/public_accumulator_'+case for case in ('build_explicit_parts','supplement_empty_terminal','supplement_partial_terminal')}
          assert len(expected) == 8 and len(leaves) == 100, ('actual leaf count', len(leaves))
          assert {k[1] for k,v in leaves.items() if v == 'fail'} == expected, 'wrong candidate failure mechanism'
          assert sum(v == 'pass' for v in leaves.values()) == 92 and 'skip' not in leaves.values(), 'controls did not all pass'
          assert int(pathlib.Path('/tmp/part-index-exit.txt').read_text()) == 1, 'actual RED missing'
          result = {'source':'faff74124c1008f39c6ee00e126d878028745b13','actualExit':1,'leaves':[{'package':k[0],'test':k[1],'outcome':v} for k,v in leaves.items()]}
          pathlib.Path('/tmp/part-index-leaves.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PYCANDIDATE
          exit "$(cat /tmp/part-index-exit.txt)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owned-responses-1698-current-candidate-part-index-actual
          path: |
            /tmp/part-index-tests.jsonl
            /tmp/part-index-tests.stderr
            /tmp/part-index-exit.txt
            /tmp/part-index.cover
            /tmp/part-index-leaves.json
            /tmp/part-index-go-version.txt
            /tmp/part-index-format.txt
          if-no-files-found: error
