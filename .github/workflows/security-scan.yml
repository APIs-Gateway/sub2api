name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -Eq '^go version go1\.26\.10 [^ ]+$'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          git rev-parse HEAD > audit-head.txt
          git rev-parse HEAD^{tree} > audit-tree.txt
          sha256sum package.json pnpm-lock.yaml ../.github/audit-exceptions.yml ../tools/check_pnpm_audit_exceptions.py > audit-inputs.sha256
          set +e
          pnpm audit --prod --audit-level=high --json > audit.json 2> audit.stderr
          audit_status=$?
          set -e
          printf '%s\n' "$audit_status" > audit.exit
          # The unchanged exception checker below decides vulnerability policy.
          # Keep the real audit exit and JSON, including on checker failure.
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
      - name: Preserve raw frontend audit and exact policy inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-security-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/audit.json
            frontend/audit.stderr
            frontend/audit.exit
            frontend/audit-head.txt
            frontend/audit-tree.txt
            frontend/audit-inputs.sha256
            frontend/package.json
            frontend/pnpm-lock.yaml
            .github/audit-exceptions.yml
            tools/check_pnpm_audit_exceptions.py
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
